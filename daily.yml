# .github/workflows/daily.yml — runs the engine every morning (07:00 UTC).
# Repo secrets required: ANTHROPIC_API_KEY, ROBINREACH_API_KEY, ROBINREACH_BRAND_ID
# Optional: SALESMAKE_DEFAULT_IMAGE (hosted brand image for IG/Pinterest).
# Auto-posting happens only when REVIEW_MODE=False in content_engine.py.
name: salesmake-daily-content
on:
  schedule:
    - cron: "0 6 * * *"   # collect early; posts go out at the slots below
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          ROBINREACH_API_KEY:     ${{ secrets.ROBINREACH_API_KEY }}
          ROBINREACH_BRAND_ID:    ${{ secrets.ROBINREACH_BRAND_ID }}
          SALESMAKE_DEFAULT_IMAGE: ${{ secrets.SALESMAKE_DEFAULT_IMAGE }}
        run: python content_engine.py
      - run: |
          git config user.name "content-bot"
          git config user.email "bot@salesmake.agency"
          git add queue/ && git commit -m "queue $(date +%F)" || echo "nothing new"
          git push || echo "no push"
